<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kiedy: reguła powtarzania</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif}
button,input,select{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #F2F5F7; color: #14202B; display: flex; flex-direction: column; padding: 16px 16px 32px; gap: 14px">

  <header style="display: flex; align-items: center; gap: 8px; min-height: 48px">
    <button type="button" aria-label="Wróć" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; margin-left: -8px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14202B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 12px; color: #556575; font-weight: 500">Wymiana filtra</div>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.1">Kiedy</h1>
    </div>
  </header>

  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Jak często blok się powtarza</legend>

    <div style="border-radius: 16px; border: 1px solid #D5DDE4; background: #FFFFFF; padding: 0 14px; min-height: 60px; display: flex; align-items: center; gap: 12px">
      <input id="w-daily" type="radio" name="when" style="width: 22px; height: 22px; margin: 0; accent-color: #2D5BFF">
      <label for="w-daily" style="flex: 1; min-height: 60px; display: flex; align-items: center; font-size: 16px; font-weight: 600">Codziennie</label>
    </div>

    <div style="border-radius: 16px; border: 1px solid #D5DDE4; background: #FFFFFF; padding: 0 14px; min-height: 60px; display: flex; align-items: center; gap: 12px">
      <input id="w-days" type="radio" name="when" style="width: 22px; height: 22px; margin: 0; accent-color: #2D5BFF">
      <label for="w-days" style="flex: 1; min-height: 60px; display: flex; align-items: center; font-size: 16px; font-weight: 600">Wybrane dni tygodnia</label>
    </div>

    <div style="border-radius: 16px; border: 2px solid #2D5BFF; background: #FFFFFF; padding: 0 14px 16px; display: flex; flex-direction: column; box-shadow: 0 8px 22px rgba(45,91,255,0.12)">
      <div style="min-height: 58px; display: flex; align-items: center; gap: 12px">
        <input id="w-every" type="radio" name="when" checked style="width: 22px; height: 22px; margin: 0; accent-color: #2D5BFF">
        <label for="w-every" style="flex: 1; min-height: 58px; display: flex; align-items: center; font-size: 16px; font-weight: 600">Co jakiś czas</label>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 10px">
          <label for="every-n" style="font-size: 15px; font-weight: 500">Powtarzaj co</label>
          <input id="every-n" type="number" value="3" style="width: 64px; height: 48px; border-radius: 12px; border: 1px solid #D5DDE4; background: #F7F9FB; padding: 0 8px; font-size: 18px; font-weight: 600; text-align: center; color: #14202B; box-sizing: border-box">
          <select id="every-unit" aria-label="Jednostka okresu" style="flex: 1; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid #D5DDE4; background: #F7F9FB; padding: 0 10px; font-size: 16px; color: #14202B">
            <option>dni</option>
            <option>tygodni</option>
            <option selected>miesięcy</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="from" style="font-size: 13px; font-weight: 600">Od dnia</label>
          <input id="from" type="text" value="10 listopada 2026" style="height: 48px; border-radius: 12px; border: 1px solid #D5DDE4; background: #F7F9FB; padding: 0 12px; font-size: 16px; color: #14202B; box-sizing: border-box; width: 100%">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 13px; font-weight: 600">Najbliższe terminy</div>
          <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 12px; background: #E6ECFF">
            <span style="font-size: 14px; font-weight: 600; color: #1F44C8">wt, 10 listopada 2026</span>
            <span style="font-size: 12px; font-weight: 600; color: #1F44C8">dziś</span>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 12px; background: #F2F5F7">
            <span style="font-size: 14px; font-weight: 500; color: #14202B">śr, 10 lutego 2027</span>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 12px; background: #F2F5F7">
            <span style="font-size: 14px; font-weight: 500; color: #14202B">pn, 10 maja 2027</span>
          </div>
        </div>
      </div>
    </div>

    <div style="border-radius: 16px; border: 1px solid #D5DDE4; background: #FFFFFF; padding: 0 14px; min-height: 60px; display: flex; align-items: center; gap: 12px">
      <input id="w-dom" type="radio" name="when" style="width: 22px; height: 22px; margin: 0; accent-color: #2D5BFF">
      <label for="w-dom" style="flex: 1; min-height: 60px; display: flex; align-items: center; font-size: 16px; font-weight: 600">Raz w miesiącu, w wybrany dzień</label>
    </div>

    <div style="border-radius: 16px; border: 1px solid #D5DDE4; background: #FFFFFF; padding: 0 14px; min-height: 60px; display: flex; align-items: center; gap: 12px">
      <input id="w-once" type="radio" name="when" style="width: 22px; height: 22px; margin: 0; accent-color: #2D5BFF">
      <label for="w-once" style="flex: 1; min-height: 60px; display: flex; align-items: center; font-size: 16px; font-weight: 600">Jednorazowo</label>
    </div>
  </fieldset>

  <section aria-label="Jeśli nie zrobię w terminie" style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 600">Jeśli nie zrobię w terminie</div>
    <div role="group" aria-label="Jeśli nie zrobię w terminie" style="display: flex; gap: 4px; background: #E7ECF0; border-radius: 14px; padding: 4px">
      <button type="button" aria-pressed="true" style="flex: 1; min-height: 48px; border-radius: 11px; border: 0; background: #FFFFFF; box-shadow: 0 1px 3px rgba(20,32,43,0.15); font-size: 14px; font-weight: 600; color: #14202B">Zostaje do zrobienia</button>
      <button type="button" aria-pressed="false" style="flex: 1; min-height: 48px; border-radius: 11px; border: 0; background: transparent; font-size: 14px; font-weight: 600; color: #3F4F5E">Zostaje niezaliczony</button>
    </div>
    <div style="font-size: 12px; line-height: 1.45; color: #556575">Zaległy blok przechodzi na kolejny dzień, najwyżej 2 razy. Potem zostaje w historii jako niezaliczony. Wpis nigdy nie znika.</div>
  </section>

  <button type="button" style="min-height: 56px; border-radius: 16px; border: 0; background: #2D5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; margin-top: 4px">Gotowe</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

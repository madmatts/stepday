<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Wybór typu bloku</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; min-height: 920px; box-sizing: border-box; background: #F2F5F7; color: #14202B; display: flex; flex-direction: column; padding: 16px 16px 32px; gap: 16px">

  <header style="display: flex; align-items: center; gap: 8px; min-height: 48px">
    <button type="button" aria-label="Wróć" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; margin-left: -8px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14202B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 style="margin: 0; flex: 1; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Nowy blok</h1>
  </header>

  <p style="margin: 0; font-size: 16px; line-height: 1.4; color: #3F4F5E">Jak chcesz to zaliczać? Typ decyduje, co zobaczysz, gdy blok przyjdzie na ciebie.</p>

  <div style="display: flex; flex-direction: column; gap: 10px">

    <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 88px; padding: 14px; border-radius: 18px; border: 1px solid #D5DDE4; background: #FFFFFF; text-align: left; color: #14202B; width: 100%; box-sizing: border-box">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: #E6ECFF; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F44C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Lista</span>
        <span style="font-size: 13px; line-height: 1.35; color: #556575">Kilka rzeczy, każda odhaczana osobno. Np. tabletki, zakupy.</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A8B9B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>

    <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 88px; padding: 14px; border-radius: 18px; border: 1px solid #D5DDE4; background: #FFFFFF; text-align: left; color: #14202B; width: 100%; box-sizing: border-box">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: #E6ECFF; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F44C8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4.5 4.5L19 7"/></svg>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Tak / nie</span>
        <span style="font-size: 13px; line-height: 1.35; color: #556575">Jedna czynność, zrobiona albo nie. Np. wymiana filtra.</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A8B9B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>

    <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 88px; padding: 14px; border-radius: 18px; border: 1px solid #D5DDE4; background: #FFFFFF; text-align: left; color: #14202B; width: 100%; box-sizing: border-box">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: #E6ECFF; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F44C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/></svg>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Licznik</span>
        <span style="font-size: 13px; line-height: 1.35; color: #556575">Zbierasz do celu, po trochu. Np. woda, kroki.</span>
        <span style="align-self: flex-start; margin-top: 4px; background: #E6ECFF; color: #1F44C8; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px">zwykle w ciągu dnia</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A8B9B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>

    <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 88px; padding: 14px; border-radius: 18px; border: 1px solid #D5DDE4; background: #FFFFFF; text-align: left; color: #14202B; width: 100%; box-sizing: border-box">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: #E6ECFF; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F44C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2M9 3h6"/></svg>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Timer</span>
        <span style="font-size: 13px; line-height: 1.35; color: #556575">Czynność, która ma trwać określony czas. Np. spacer, nauka.</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A8B9B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>

    <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 88px; padding: 14px; border-radius: 18px; border: 1px solid #D5DDE4; background: #FFFFFF; text-align: left; color: #14202B; width: 100%; box-sizing: border-box">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: #E6ECFF; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F44C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Notatka</span>
        <span style="font-size: 13px; line-height: 1.35; color: #556575">Krótki tekst. Np. jedno zdanie na koniec dnia.</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A8B9B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>

  </div>

  <section aria-label="Szablony" style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
    <div style="font-size: 13px; font-weight: 600">Albo zacznij od gotowego szablonu</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D5DDE4; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #14202B">Poranek</button>
      <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D5DDE4; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #14202B">Wieczór</button>
      <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D5DDE4; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #14202B">Dzień roboczy</button>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>

  }

</body>
</html>
